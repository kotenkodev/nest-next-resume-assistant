$kind: http-request
description: Sign out and invalidate the session. Postman applies the expired cookies returned by the server.
url: '{{baseUrl}}/auth/sign-out'
method: POST
headers:
  Origin: '{{originUrl}}'
body:
  type: text
  content: ''
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
settings: {}
examples: ./.resources/Sign out and clear session cookie.resources/examples
order: 3000
