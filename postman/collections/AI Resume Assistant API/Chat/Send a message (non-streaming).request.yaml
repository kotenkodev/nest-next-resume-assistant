$kind: http-request
description: ''
url: '{{baseUrl}}/chat/:id/messages'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: '{{conversationId}}'
    disabled: false
    description: UUID of the resource
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "message": "What are the key skills I should highlight?"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "message": {
          "type": "string",
          "minLength": 1,
          "maxLength": 1000,
          "example": "What are the key skills I should highlight?"
        }
      },
      "required": [
        "message"
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', () => pm.response.to.have.status(201));
      pm.test('Response has userMessage and assistantMessage', () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property('userMessage').that.is.an('object');
        pm.expect(json).to.have.property('assistantMessage').that.is.an('object');
      });
      pm.test('userMessage has correct shape', () => {
        const { userMessage } = pm.response.json();
        pm.expect(userMessage).to.have.property('id').that.is.a('string');
        pm.expect(userMessage).to.have.property('role').that.equals('user');
        pm.expect(userMessage).to.have.property('content').that.is.a('string');
        pm.expect(userMessage).to.have.property('conversationId').that.equals(pm.environment.get('conversationId'));
      });
      pm.test('assistantMessage has correct shape', () => {
        const { assistantMessage } = pm.response.json();
        pm.expect(assistantMessage).to.have.property('id').that.is.a('string');
        pm.expect(assistantMessage).to.have.property('role').that.equals('assistant');
        pm.expect(assistantMessage).to.have.property('content').that.is.a('string');
      });
settings: {}
examples: ./.resources/Send a message (non-streaming).resources/examples
order: 5000
