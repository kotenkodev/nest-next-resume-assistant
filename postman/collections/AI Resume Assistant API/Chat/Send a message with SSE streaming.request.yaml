$kind: http-request
description: ''
url: '{{baseUrl}}/chat/:id/messages/stream'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: text/event-stream
pathVariables:
  - key: id
    value: '{{conversationId}}'
    disabled: false
    description: UUID of the resource
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "message": "What are the key skills I should highlight?"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "message": {
          "type": "string",
          "minLength": 1,
          "maxLength": 1000,
          "example": "What are the key skills I should highlight?"
        }
      },
      "required": [
        "message"
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Content-Type is text/event-stream', () => {
        pm.expect(pm.response.headers.get('content-type')).to.include('text/event-stream');
      });
      pm.test('Response body contains SSE data', () => {
        const body = pm.response.text();
        pm.expect(body).to.include('data:');
      });
settings: {}
examples: ./.resources/Send a message with SSE streaming.resources/examples
order: 6000
