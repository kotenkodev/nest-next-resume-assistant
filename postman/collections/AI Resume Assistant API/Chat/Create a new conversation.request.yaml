$kind: http-request
description: ''
url: '{{baseUrl}}/chat'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "resumeId": "{{resumeId}}",
      "jobPostingIds": [
        "{{jobPostingId}}"
      ],
      "title": "Interview prep for Senior Engineer role"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "resumeId": {
          "type": "string",
          "example": "123e4567-e89b-12d3-a456-426614174000",
          "format": "uuid"
        },
        "jobPostingIds": {
          "type": "array",
          "example": [
            "123e4567-e89b-12d3-a456-426614174001"
          ],
          "items": {
            "type": "string",
            "format": "uuid"
          }
        },
        "title": {
          "type": "string",
          "example": "Interview prep for Senior Engineer role"
        }
      },
      "required": [
        "resumeId",
        "jobPostingIds"
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      if (json && json.id) {
        pm.environment.set('conversationId', json.id);
        console.log('conversationId set to', json.id);
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', () => pm.response.to.have.status(201));
      pm.test('Response has Conversation fields', () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property('id').that.is.a('string');
        pm.expect(json).to.have.property('resumeId').that.equals(pm.environment.get('resumeId'));
        pm.expect(json).to.have.property('createdAt');
      });
      pm.test('conversationId env var was set', () => {
        pm.expect(pm.environment.get('conversationId')).to.not.be.empty;
      });
settings: {}
examples: ./.resources/Create a new conversation.resources/examples
order: 2000
