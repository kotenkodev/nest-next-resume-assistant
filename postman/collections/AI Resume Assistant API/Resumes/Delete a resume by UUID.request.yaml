$kind: http-request
description: ""
url: "{{baseUrl}}/resumes/:id"
method: DELETE
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: '{{resumeId}}'
    disabled: false
    description: UUID of the resource
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 204', () => pm.response.to.have.status(204));
      pm.test('Response body is empty', () => {
        pm.expect(pm.response.text()).to.be.empty;
      });
settings: {}
examples: ./.resources/Delete a resume by UUID.resources/examples
order: 4000
