$kind: http-request
description: ""
url: "{{baseUrl}}/resumes/:id"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Cookie
    value: 'better-auth.session_token={{sessionToken}}'
pathVariables:
  - key: id
    value: '{{resumeId}}'
    disabled: false
    description: UUID of the resource
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
settings: {}
examples: ./.resources/Get a single resume by UUID.resources/examples
order: 3000
