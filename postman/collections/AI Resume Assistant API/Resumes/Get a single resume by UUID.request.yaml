$kind: http-request
description: ""
url: "{{baseUrl}}/resumes/:id"
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: '{{resumeId}}'
    disabled: false
    description: UUID of the resource
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Response has resume fields', () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property('id').that.equals(pm.environment.get('resumeId'));
        pm.expect(json).to.have.property('fileName').that.is.a('string');
        pm.expect(json).to.have.property('status').that.is.a('string');
        pm.expect(json).to.have.property('createdAt');
        pm.expect(json).to.have.property('updatedAt');
      });
settings: {}
examples: ./.resources/Get a single resume by UUID.resources/examples
order: 3000
