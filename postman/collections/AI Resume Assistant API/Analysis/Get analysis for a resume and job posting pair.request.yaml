  type: text
  content: ''
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Response is FitAnalysis or null', () => {
        const json = pm.response.json();
        if (json !== null) {
          pm.expect(json).to.have.property('id').that.is.a('string');
          pm.expect(json).to.have.property('matchScore').that.is.a('number');
          pm.expect(json).to.have.property('skillGaps').that.is.an('object');
          pm.expect(json).to.have.property('experienceAlignment').that.is.an('object');
          pm.expect(json).to.have.property('interviewPrep').that.is.an('object');
        }
      });
