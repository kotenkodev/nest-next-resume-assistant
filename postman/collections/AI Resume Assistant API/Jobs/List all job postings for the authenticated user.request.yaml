$kind: http-request
description: ''
url: '{{baseUrl}}/jobs'
method: GET
headers:
  - key: Accept
    value: application/json
body:
  type: text
  content: ''
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Response is an array', () => {
        const json = pm.response.json();
        pm.expect(json).to.be.an('array');
      });
      pm.test('Each job posting has required fields', () => {
        const json = pm.response.json();
        json.forEach(j => {
          pm.expect(j).to.have.property('id');
          pm.expect(j).to.have.property('fileName');
          pm.expect(j).to.have.property('status');
          pm.expect(j).to.have.property('createdAt');
        });
      });
settings: {}
examples: ./.resources/List all job postings for the authenticated user.resources/examples
order: 1000
