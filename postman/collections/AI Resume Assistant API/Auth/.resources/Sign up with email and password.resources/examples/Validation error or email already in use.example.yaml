$kind: http-example
request:
  url: '{{baseUrl}}/auth/sign-up/email'
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "email": "user@example.com",
        "password": "secret123",
        "name": "John Doe"
      }
response:
  statusCode: 400
  statusText: Bad Request
  body:
    type: text
    content: ''
order: 2000
