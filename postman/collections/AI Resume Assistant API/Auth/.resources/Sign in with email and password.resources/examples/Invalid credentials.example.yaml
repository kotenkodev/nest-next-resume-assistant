$kind: http-example
request:
  url: "{{baseUrl}}/auth/sign-in/email"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "email": "user@example.com",
        "password": "secret123"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: ""
order: 2000
