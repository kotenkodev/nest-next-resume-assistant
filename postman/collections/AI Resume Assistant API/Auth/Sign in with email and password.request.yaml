$kind: http-request
description: "Sign in with email and password. On success, the sessionToken environment variable is automatically populated from the Set-Cookie header."
url: '{{baseUrl}}/auth/sign-in/email'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{testEmail}}",
      "password": "{{testPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const cookieHeader = pm.response.headers.get('set-cookie') || '';
      const match = cookieHeader.match(/better-auth\.session_token=([^;]+)/);
      if (match) {
        pm.environment.set('sessionToken', match[1]);
        console.log('sessionToken captured from Set-Cookie header');
      } else {
        console.warn('better-auth.session_token cookie not found in response');
      }
settings: {}
examples: ./.resources/Sign in with email and password.resources/examples
order: 1000
