$kind: http-request
description: "Register a new account. Uses the testEmail and testPassword environment variables."
url: '{{baseUrl}}/auth/sign-up/email'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{testEmail}}",
      "password": "{{testPassword}}",
      "name": "Test User"
    }
settings: {}
examples: ./.resources/Sign up with email and password.resources/examples
order: 2000
