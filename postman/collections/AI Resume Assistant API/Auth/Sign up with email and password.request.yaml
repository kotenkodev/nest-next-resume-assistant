$kind: http-request
description: Register and sign in with testEmail and testPassword. Postman stores the session cookies for subsequent requests.
url: '{{baseUrl}}/auth/sign-up/email'
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
  Origin: '{{originUrl}}'
body:
  type: json
  content: |-
    {
      "email": "{{testEmail}}",
      "password": "{{testPassword}}",
      "name": "Test User"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Response is JSON', () => pm.response.to.be.json);
      pm.test('Response has user object', () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property('user');
        pm.expect(json.user).to.have.property('id');
        pm.expect(json.user).to.have.property('email');
      });
    language: text/javascript
settings: {}
examples: ./.resources/Sign up with email and password.resources/examples
order: 2000
