services:
  # 1. PostgreSQL 16 + pgvector for vector search & relational data
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resume-assistant-db
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-resume_assistant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-resume_assistant}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Local MinIO (S3-compatible Object Storage for Resumes & Job PDFs)
  minio:
    image: minio/minio:latest
    container_name: resume-assistant-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data

  # One-shot bucket creator for MinIO
  minio-create-buckets:
    image: minio/mc:latest
    container_name: resume-assistant-create-buckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin}; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      /usr/bin/mc mb local/${S3_BUCKET:-resume-assistant} --ignore-existing;
      /usr/bin/mc anonymous set download local/${S3_BUCKET:-resume-assistant};
      echo 'Bucket ${S3_BUCKET:-resume-assistant} ready.';
      exit 0;
      "

  # 3. NestJS Backend API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: resume-assistant-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-resume_assistant}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-your-secret-key-at-least-32-chars-long}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-resume-assistant}
      AI_API_KEY: ${AI_API_KEY}
      AI_API_URL: ${AI_API_URL:-https://api.groq.com/openai/v1}
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-20b}
      JINA_API_KEY: ${JINA_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-jina-embeddings-v3}
      RUN_MIGRATIONS: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  # 4. Next.js Frontend Web App
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: resume-assistant-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      - api

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
